name: Train TinyCodeGPT SLM

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Model preset"
        type: choice
        options: [tiny, small]
        default: tiny
      steps:
        description: "Training steps"
        type: number
        default: 1500
      commit_weights:
        description: "Commit refreshed weights back to main"
        type: boolean
        default: false
  schedule:
    # Weekly refresh: Sundays 03:00 UTC (tiny preset, artifact only)
    - cron: "0 3 * * 0"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PRESET: ${{ inputs.preset || 'tiny' }}
      STEPS: ${{ inputs.steps || 2500 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch (CPU) + rich
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install rich

      - name: Train TinyCodeGPT on runner CPU
        run: |
          python -m agent_zed.slm.train_github \
            --preset "$PRESET" \
            --steps "$STEPS" \
            --out agent_zed/slm/weights/tinycodegpt_char.json

      - name: Self-check pure-Python inference on trained checkpoint
        run: python -m agent_zed.slm.train_github --self-check

      - name: Run unit tests (incl. torch<->purepy parity when torch present)
        run: python -m unittest discover -s tests -v

      - name: Upload weights artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinycodegpt-weights-${{ env.PRESET }}-${{ github.run_number }}
          path: agent_zed/slm/weights/tinycodegpt_char.json
          retention-days: 30

      - name: Commit refreshed weights to main (dispatch only)
        if: ${{ inputs.commit_weights == true && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_zed/slm/weights/tinycodegpt_char.json
          if git diff --cached --quiet; then
            echo "No weight changes to commit."
          else
            git commit -m "chore(slm): refresh TinyCodeGPT weights (preset=$PRESET, steps=$STEPS, run ${{ github.run_number }}) [skip ci]"
            git push origin HEAD:main
          fi
