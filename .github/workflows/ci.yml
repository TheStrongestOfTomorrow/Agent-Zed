name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rich

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run HARD benchmark suite
        run: python -m agent_zed.benchmark.runner

      - name: Smoke-test CLI import & packaging metadata
        run: |
          python -c "import agent_zed, agent_zed.cli.interface as i; print('agent_zed', agent_zed.__version__, 'OK'); assert callable(i.main)"
